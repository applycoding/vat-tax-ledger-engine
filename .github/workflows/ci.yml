name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vat-tax-ledger-engine .
      - name: Smoke test container
        run: |
          docker run -d -p 3000:3000 --name api vat-tax-ledger-engine
          for i in $(seq 1 20); do curl -fs localhost:3000/health && break; sleep 1; done
          curl -fs -X POST localhost:3000/v1/tax/quote -H 'content-type: application/json' \
            -d '{"seller":{"country":"IE"},"customer":{"country":"DE"},"supplyType":"digital_services","lines":[{"sku":"A","quantity":1,"unitPrice":1000}]}'
